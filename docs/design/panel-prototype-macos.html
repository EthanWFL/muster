<script>
  // follow the system appearance; the demo button can override it
  (function () {
    var q = location.search.match(/theme=(light|dark)/);
    document.documentElement.dataset.theme = q ? q[1] : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');

<style>
  /* Semantic colors, named after their AppKit / SwiftUI counterparts so the SwiftUI port maps 1:1 */
  :root[data-theme="dark"] {
    --label: rgba(255,255,255,0.85);
    --label-2: rgba(255,255,255,0.55);
    --label-3: rgba(255,255,255,0.30);
    --fill: rgba(255,255,255,0.10);         /* .secondary fill: controls */
    --fill-q: rgba(255,255,255,0.06);       /* .quaternary fill: selected row, hover */
    --sep: rgba(255,255,255,0.10);
    --accent: #0a84ff;
    --red: #ff453a; --orange: #ff9f0a; --green: #30d158;
    --material: rgba(38,38,40,0.72);
    --code: rgba(0,0,0,0.26);
    --wall: radial-gradient(1200px 700px at 20% 10%, #2b3a55 0%, transparent 60%), radial-gradient(900px 600px at 90% 80%, #4a2f4f 0%, transparent 55%), #14161c;
    --bar: rgba(20,20,22,0.55);
    --thumb: rgba(255,255,255,0.16);
    --shadow: 0 0 0 0.5px rgba(255,255,255,0.14), 0 16px 48px rgba(0,0,0,0.5);
  }
  :root[data-theme="light"] {
    --label: rgba(0,0,0,0.85);
    --label-2: rgba(0,0,0,0.55);
    --label-3: rgba(0,0,0,0.30);
    --fill: rgba(0,0,0,0.08);
    --fill-q: rgba(0,0,0,0.05);
    --sep: rgba(0,0,0,0.10);
    --accent: #007aff;
    --red: #ff3b30; --orange: #ff9500; --green: #34c759;
    --material: rgba(246,246,246,0.78);
    --code: rgba(0,0,0,0.05);
    --wall: radial-gradient(1200px 700px at 20% 10%, #cfe0f5 0%, transparent 60%), radial-gradient(900px 600px at 90% 80%, #f1d5e4 0%, transparent 55%), #e9ecf1;
    --bar: rgba(255,255,255,0.55);
    --thumb: #ffffff;
    --shadow: 0 0 0 0.5px rgba(0,0,0,0.18), 0 16px 48px rgba(0,0,0,0.22);
  }
  :root {
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; background: var(--wall); background-attachment: fixed; color: var(--label); font: 400 13px/16px var(--sans); -webkit-font-smoothing: antialiased; }

  .menubar { height: 28px; display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding: 0 16px; background: var(--bar); backdrop-filter: blur(30px) saturate(1.8); color: var(--label); font-size: 13px; }
  .menubar .item { display: flex; align-items: center; gap: 4px; padding: 0 6px; height: 20px; border-radius: 4px; background: var(--fill); }
  .menubar .count { font: 500 12px/16px var(--sans); font-variant-numeric: tabular-nums; }
  .menubar .count:empty { display: none; }

  .stage { display: flex; justify-content: flex-end; padding: 6px 16px; }
  /* border + shadow + radius are drawn by the system in the real MenuBarExtra window */
  .panel { width: 420px; border-radius: 16px; background: var(--material); backdrop-filter: blur(40px) saturate(1.8); box-shadow: var(--shadow); overflow: hidden; }

  svg.i { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* segmented control */
  .segwrap { padding: 12px 12px 8px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 2px; border-radius: 10px; background: var(--fill-q); box-shadow: inset 0 0 0 0.5px var(--sep); }
  .seg button { height: 24px; display: flex; align-items: center; justify-content: center; gap: 4px; border: 0; border-radius: 8px; background: transparent; color: var(--label); font: 500 12px/16px var(--sans); cursor: default; transition: background-color 150ms var(--ease); }
  .seg button:not([aria-selected="true"]) { color: var(--label-2); }
  .seg button[aria-selected="true"] { background: var(--thumb); box-shadow: 0 0.5px 1px rgba(0,0,0,0.2), 0 0 0 0.5px rgba(0,0,0,0.04); color: var(--label); }
  .badge { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font: 600 11px/16px var(--sans); text-align: center; font-variant-numeric: tabular-nums; }
  .badge:empty { display: none; }

  .body { padding: 4px 8px 8px; min-height: 240px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; }
  .pane { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; min-width: 0; }
  .pane[hidden] { display: none; }

  /* approvals */
  .row { position: relative; padding: 8px 12px 10px; border-radius: 10px; transition: background-color 150ms var(--ease); }
  .row.approval:hover { background: var(--fill-q); }
  .row.approval.sel { background: var(--fill-q); }
  .line1, .line2 { display: flex; align-items: center; gap: 8px; }
  .tool { font-weight: 600; }
  .sum { flex: 1; min-width: 0; font: 400 12px/16px var(--mono); color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t { font: 400 11px/14px var(--sans); color: var(--label-3); font-variant-numeric: tabular-nums; color: var(--label-2); }
  .line2 { margin-top: 2px; padding-left: 16px; font-size: 11px; line-height: 14px; color: var(--label-2); }
  .line2 .meta { flex: 1; }
  .risk.high { color: var(--red); } .risk.medium { color: var(--orange); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--label-3); }
  .dot.high { background: var(--red); } .dot.medium { background: var(--orange); } .dot.running { background: var(--green); } .dot.waiting { background: var(--orange); } .dot.idle { background: var(--label-3); }
  .rep { font: 400 11px/14px var(--sans); color: var(--label-2); }

  /* the 90 s countdown: this panel's signature */
  .count-line { position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px; border-radius: 1px; background: var(--fill-q); overflow: hidden; }
  .count-line i { display: block; height: 100%; width: 100%; background: var(--label-3); transform-origin: left; transition: transform 1s linear; }
  .count-line.urgent i { background: var(--red); }

  .detail { margin-top: 12px; display: grid; gap: 12px; }
  .code { padding: 8px 12px; border-radius: 8px; background: var(--code); font: 400 12px/18px var(--mono); white-space: pre-wrap; word-break: break-all; }
  .code .add { color: var(--green); display: block; } .code .del { color: var(--red); display: block; } .code .ctx { color: var(--label-2); display: block; }
  .kv { display: grid; grid-template-columns: 56px 1fr; gap: 2px 8px; font-size: 11px; line-height: 14px; color: var(--label-2); }
  .kv b { font-weight: 400; color: var(--label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { height: 28px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 14px; background: var(--fill); color: var(--label); font: 500 13px/16px var(--sans); cursor: default; transition: background-color 150ms var(--ease), transform 150ms var(--ease); }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.quiet { background: transparent; color: var(--label-2); padding: 0 8px; }
  .btn.quiet:hover { background: var(--fill-q); filter: none; }
  .btn[disabled] { opacity: 0.4; }
  .g { font: 400 12px/16px var(--sans); opacity: 0.6; }

  .reason { display: flex; gap: 8px; }
  .reason input { flex: 1; height: 28px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--code); color: var(--label); font: 400 13px/16px var(--sans); outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .hint { font-size: 11px; line-height: 14px; color: var(--label-2); }

  .empty { padding: 48px 16px; text-align: center; color: var(--label-2); }
  .empty strong { display: block; font-weight: 600; color: var(--label); margin-bottom: 4px; }

  .srow, .erow { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px; }
  .srow:hover, .erow:hover { background: var(--fill-q); }
  .srow .name, .erow .main { flex: 1; min-width: 0; }
  .srow small, .erow small { display: block; font-size: 11px; line-height: 14px; color: var(--label-2); }
  .srow .st { font-size: 11px; color: var(--label-2); } .srow .st.waiting { color: var(--orange); }
  .label { padding: 12px 12px 4px; font: 500 11px/14px var(--sans); color: var(--label-2); }
  .label:first-child { padding-top: 8px; }
  .mono { font: 400 12px/16px var(--mono); }
  .conf { font: 400 11px/14px var(--sans); color: var(--label-2); font-variant-numeric: tabular-nums; }
  .conf.low { color: var(--orange); }
  .chk { appearance: none; width: 14px; height: 14px; border-radius: 4px; background: var(--fill); box-shadow: inset 0 0 0 0.5px var(--sep); flex: none; display: grid; place-items: center; }
  .chk:checked { background: var(--accent); box-shadow: none; }
  .chk:checked::after { content: ""; width: 7px; height: 4px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: translateY(-1px) rotate(-45deg); }
  .plan { margin: 8px 4px 0; padding: 12px; border-radius: 10px; background: var(--code); display: grid; gap: 12px; }
  .plan code { display: block; font: 400 12px/18px var(--mono); color: var(--label-2); white-space: pre-wrap; }
  .plan .bar { display: flex; align-items: center; justify-content: space-between; }

  .frow { padding: 8px 12px; border-radius: 10px; display: grid; gap: 2px; }
  .frow:hover { background: var(--fill-q); }
  .frow .top { display: flex; align-items: center; gap: 8px; }
  .frow .kind { font-size: 11px; line-height: 14px; color: var(--label-2); width: 64px; flex: none; }
  .frow .what { flex: 1; min-width: 0; }
  .frow .locs { padding-left: 72px; display: grid; font: 400 11px/16px var(--mono); color: var(--label-2); }

  .foot { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 8px 0 16px; border-top: 0.5px solid var(--sep); color: var(--label-2); font-size: 11px; }

  .demo { position: fixed; left: 16px; bottom: 16px; color: var(--label-2); font-size: 11px; display: grid; gap: 8px; }
  .demo button { all: unset; text-decoration: underline; text-underline-offset: 2px; cursor: default; color: var(--label); }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-term" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></symbol>
</svg>

<div class="menubar">
  <span>Wed 10:42</span>
  <span class="item"><svg class="i"><use href="#i-term"/></svg><span class="count" id="badge"></span></span>
</div>

<div class="stage">
  <div class="panel" role="dialog" aria-label="Muster">
    <div class="segwrap"><div class="seg" role="tablist">
      <button role="tab" data-tab="approvals">Approvals <span class="badge" id="n-approvals"></span></button>
      <button role="tab" data-tab="sessions">Sessions</button>
      <button role="tab" data-tab="env">Environment</button>
      <button role="tab" data-tab="rules">Rules</button>
    </div></div>
    <div class="body">
      <div class="pane" id="p-approvals"></div>
      <div class="pane" id="p-sessions" hidden></div>
      <div class="pane" id="p-env" hidden></div>
      <div class="pane" id="p-rules" hidden></div>
    </div>
    <div class="foot">
      <span>⌃⌥A opens the panel</span>
      <div><button class="btn quiet">Settings… <span class="g">⌘,</span></button><button class="btn quiet">Quit <span class="g">⌘Q</span></button></div>
    </div>
  </div>
</div>

<div class="demo">
  <span>j / k select · ⏎ allow · ⌥⏎ similar · ⌫ deny</span>
  <span><button id="theme">Switch appearance</button> &nbsp; <button id="reset">Reset demo</button></span>
</div>

<script>
const TIMEOUT = 90;
const seed = () => ({
  approvals: [
    { id: 'a1', tool: 'Bash', sum: 'rm -rf ./build', risk: 'high', cwd: '~/Code/inkwell', agent: 'claude', session: '7c1e…a90', elapsed: 42, rep: 1, body: 'rm -rf ./build' },
    { id: 'a2', tool: 'Bash', sum: 'git push origin main', risk: 'high', cwd: '~/Code/api', agent: 'codex', session: '2f40…c1d', elapsed: 12, rep: 1, body: 'git push origin main' },
    { id: 'a3', tool: 'Edit', sum: 'src/app.ts  +2 −1', risk: 'medium', cwd: '~/Code/inkwell', agent: 'claude', session: '7c1e…a90', elapsed: 8, rep: 1,
      diff: [['ctx','  export function boot() {'],['del','-   const port = 3000'],['add','+   const port = Number(process.env.PORT ?? 3000)'],['add','+   validate(port)'],['ctx','    return listen(port)']] },
    { id: 'a4', tool: 'Bash', sum: 'pnpm install', risk: 'medium', cwd: '~/Code/inkwell', agent: 'claude', session: '9b03…e77', elapsed: 5, rep: 3, body: 'pnpm install' },
  ],
  sessions: [
    { name: 'inkwell', cwd: '~/Code/inkwell', agent: 'claude', state: 'waiting', note: '3 approvals' },
    { name: 'api', cwd: '~/Code/api', agent: 'codex', state: 'waiting', note: '1 approval' },
    { name: 'muster', cwd: '~/Code/muster', agent: 'claude', state: 'running', note: 'Bash: swift build' },
    { name: 'dotfiles', cwd: '~/Code/dotfiles', agent: 'claude', state: 'idle', note: 'Idle 12 min' },
  ],
  ports: [
    { id: 'p1', port: ':5173', proc: 'node · vite', owner: 'inkwell · claude', pid: 51234, conf: 96 },
    { id: 'p2', port: ':8787', proc: 'wrangler dev', owner: 'api · codex', pid: 51802, conf: 91 },
  ],
  orphans: [
    { id: 'o1', proc: 'esbuild', owner: 'inkwell', pid: 48211, detail: 'ppid 1 · 78% CPU for 6 min', conf: 84 },
    { id: 'o2', proc: 'node', owner: 'unknown', pid: 40907, detail: 'cwd matches ~/Code/api', conf: 52 },
  ],
  worktrees: [
    { id: 'w1', path: 'inkwell/.wt/fix-auth', why: 'Directory missing', repo: '~/Code/inkwell' },
    { id: 'w2', path: 'inkwell/.wt/spike-ws', why: 'Branch merged', repo: '~/Code/inkwell' },
  ],
});
let S = seed();
let tab = ['approvals','sessions','env','rules'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'approvals', sel = null, denying = false;
const checked = new Set(['p1', 'p2', 'o1', 'w1']);
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const riskLabel = { high: 'High', medium: 'Medium', low: 'Low' };
const order = ['low', 'medium', 'high'];
const sorted = () => [...S.approvals].sort((a, b) => (order.indexOf(b.risk) - order.indexOf(a.risk)) || (b.elapsed - a.elapsed));

function renderApprovals() {
  const list = sorted();
  if (!list.some(a => a.id === sel)) sel = list[0]?.id ?? null;
  const el = $('#p-approvals');
  if (!list.length) { el.innerHTML = `<div class="empty"><strong>Nothing waiting</strong>Requests from your agents appear here</div>`; return; }
  el.innerHTML = list.map(a => {
    const open = a.id === sel, remain = Math.max(0, TIMEOUT - a.elapsed);
    const detail = !open ? '' : `
      <div class="detail">
        <div class="code">${a.diff ? a.diff.map(([k, t]) => `<span class="${k}">${esc(t)}</span>`).join('') : esc(a.body)}</div>
        <div class="kv"><span>Folder</span><b>${a.cwd}</b><span>Session</span><b>${a.agent} · ${a.session}</b><span>Expires</span><b id="exp-${a.id}">in ${remain}s, then ${a.agent} asks you itself</b></div>
        ${denying ? `
          <div class="reason"><input id="reason" value="Denied from Muster" aria-label="Reason sent to the agent"><button class="btn primary" data-act="confirm-deny">Deny <span class="g">⏎</span></button></div>
          <div class="hint">The agent receives this reason · Esc to cancel</div>` : `
          <div class="actions">
            <button class="btn primary" data-act="allow">Allow <span class="g">⏎</span></button>
            <button class="btn" data-act="deny">Deny <span class="g">⌫</span></button>
            <button class="btn" data-act="similar" ${a.risk === 'high' ? 'disabled title="Not offered for high-risk commands"' : ''}>Similar <span class="g">⌥⏎</span></button>
            <button class="btn quiet" data-act="term">Terminal <span class="g">⌘⏎</span></button>
          </div>`}
      </div>`;
    return `<div class="row approval ${open ? 'sel' : ''}" data-id="${a.id}">
      <div class="line1"><span class="dot ${a.risk}"></span><span class="tool">${a.tool}</span><span class="sum">${esc(a.sum)}</span>${a.rep > 1 ? `<span class="rep">×${a.rep}</span>` : ''}<span class="t" id="w-${a.id}">${a.elapsed}s</span></div>
      <div class="line2"><span class="meta">${a.cwd} · ${a.agent}</span><span class="risk ${a.risk}">${riskLabel[a.risk]}</span></div>
      ${detail}
      <div class="count-line ${remain <= 15 ? 'urgent' : ''}" id="c-${a.id}"><i style="transform:scaleX(${remain / TIMEOUT})"></i></div>
    </div>`;
  }).join('');
  if (denying) { const r = $('#reason'); r.focus(); r.select(); }
}
function renderSessions() {
  $('#p-sessions').innerHTML = `<div class="label">Active</div>` + S.sessions.map(s => `
    <div class="srow"><span class="dot ${s.state}"></span><div class="name">${s.name}<small class="mono">${s.cwd} · ${s.agent}</small></div><span class="st ${s.state}">${s.note}</span></div>`).join('');
}
function renderEnv() {
  const row = (id, main, sub, right, low) => `<label class="erow"><input class="chk" type="checkbox" data-chk="${id}" ${checked.has(id) ? 'checked' : ''}>
    <div class="main">${main}<small>${sub}</small></div><span class="conf ${low ? 'low' : ''}">${right}</span></label>`;
  const cmds = [];
  S.ports.forEach(p => checked.has(p.id) && cmds.push(`kill -TERM ${p.pid}   # ${p.proc} ${p.port}`));
  S.orphans.forEach(o => checked.has(o.id) && cmds.push(`kill -TERM ${o.pid}   # ${o.proc}`));
  S.worktrees.forEach(w => checked.has(w.id) && cmds.push(`git -C ${w.repo} worktree prune`));
  const uniq = [...new Set(cmds)];
  $('#p-env').innerHTML = `<div class="label">Listening ports</div>` +
    S.ports.map(p => row(p.id, `<span class="mono">${p.port}</span> &nbsp;${p.proc}`, p.owner, p.conf + '%')).join('') +
    `<div class="label">Orphaned processes</div>` +
    S.orphans.map(o => row(o.id, `<span class="mono">${o.proc}</span> &nbsp;pid ${o.pid}`, `${o.detail} · ${o.owner}`, o.conf < 80 ? 'Uncertain' : o.conf + '%', o.conf < 80)).join('') +
    `<div class="label">Stale worktrees</div>` +
    S.worktrees.map(w => row(w.id, `<span class="mono">${w.path}</span>`, w.why, 'Prune')).join('') +
    `<div class="plan"><code>${uniq.length ? uniq.map(esc).join('\n') : 'Nothing selected'}</code>
      <div class="bar"><span class="hint">These commands are exactly what runs</span><button class="btn primary" ${uniq.length ? '' : 'disabled'}>Clean up ${uniq.length || ''}</button></div></div>`;
}
function renderRules() {
  const f = (kind, what, locs) => `<div class="frow"><div class="top"><span class="kind">${kind}</span><span class="what">${what}</span><button class="btn quiet">Copy fix</button></div><div class="locs">${locs.map(l => `<span>${l}</span>`).join('')}</div></div>`;
  $('#p-rules').innerHTML =
    f('Duplicate', 'Run tests before committing', ['inkwell/CLAUDE.md:14', 'api/AGENTS.md:9']) +
    f('Broken ref', '<span class="mono">scripts/deploy.sh</span> does not exist', ['api/CLAUDE.md:31']) +
    f('Broken ref', '<span class="mono">pnpm lint:fix</span> not found on PATH', ['inkwell/CLAUDE.md:22']) +
    f('Conflict', 'Use pnpm vs use npm', ['inkwell/CLAUDE.md:6', 'dotfiles/AGENTS.md:3']) +
    f('Duplicate', 'Prefer named exports', ['api/CLAUDE.md:40', 'inkwell/CLAUDE.md:18']);
}
function renderTabs() {
  document.querySelectorAll('.seg button').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
  ['approvals', 'sessions', 'env', 'rules'].forEach(k => $('#p-' + k).hidden = k !== tab);
  const n = S.approvals.length;
  $('#n-approvals').textContent = n || ''; $('#badge').textContent = n || '';
}
function renderAll() { renderApprovals(); renderSessions(); renderEnv(); renderRules(); renderTabs(); }
function resolve(kind) {
  const a = S.approvals.find(x => x.id === sel); if (!a || (kind === 'similar' && a.risk === 'high')) return;
  const i = sorted().findIndex(x => x.id === a.id);
  S.approvals = S.approvals.filter(x => x.id !== a.id);
  const next = sorted(); sel = next[Math.min(i, next.length - 1)]?.id ?? null;
  denying = false; renderApprovals(); renderTabs();
}
function move(d) {
  const l = sorted(); if (!l.length) return;
  sel = l[Math.min(Math.max(l.findIndex(x => x.id === sel) + d, 0), l.length - 1)].id; denying = false; renderApprovals();
}
document.addEventListener('click', e => {
  const t = e.target.closest('.seg button'); if (t) { tab = t.dataset.tab; renderTabs(); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'allow' || act === 'similar') return resolve(act);
  if (act === 'deny') { denying = true; return renderApprovals(); }
  if (act === 'confirm-deny') return resolve('deny');
  const row = e.target.closest('.row.approval');
  if (row && row.dataset.id !== sel) { sel = row.dataset.id; denying = false; renderApprovals(); }
});
document.addEventListener('change', e => { const id = e.target.dataset.chk; if (!id) return; e.target.checked ? checked.add(id) : checked.delete(id); renderEnv(); });
document.addEventListener('keydown', e => {
  if (denying) { if (e.key === 'Enter') { e.preventDefault(); resolve('deny'); } if (e.key === 'Escape') { denying = false; renderApprovals(); } return; }
  if (tab !== 'approvals') return;
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === 'Enter' && e.altKey) { e.preventDefault(); resolve('similar'); }
  else if (e.key === 'Enter' && !e.metaKey) { e.preventDefault(); resolve('allow'); }
  else if (e.key === 'Backspace') { e.preventDefault(); if (sel) { denying = true; renderApprovals(); } }
});
$('#reset').onclick = () => { S = seed(); sel = null; denying = false; renderAll(); };
$('#theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; };

setInterval(() => {
  S.approvals.forEach(a => a.elapsed++);
  if (S.approvals.some(a => a.elapsed >= TIMEOUT)) {
    S.approvals = S.approvals.filter(a => a.elapsed < TIMEOUT); denying = false; renderApprovals(); renderTabs(); return;
  }
  S.approvals.forEach(a => {
    const remain = TIMEOUT - a.elapsed;
    const w = $('#w-' + a.id); if (w) w.textContent = a.elapsed + 's';
    const c = $('#c-' + a.id); if (c) { c.classList.toggle('urgent', remain <= 15); c.firstElementChild.style.transform = `scaleX(${remain / TIMEOUT})`; }
    const x = $('#exp-' + a.id); if (x) x.textContent = `in ${remain}s, then ${a.agent} asks you itself`;
  });
}, 1000);
renderAll();
</script>
</body>
