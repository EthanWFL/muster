<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muster · design prototype</title>
<style>
  :root {
    /* graphite ramp */
    --deep: #0f0f10;
    --bg: #141415;
    --card: #19191b;
    --raised: #232325;
    --text: #ededed;
    --text-2: #a1a1a6;
    --text-3: #85858b;
    --line: rgba(237, 237, 237, 0.08);
    --line-strong: rgba(237, 237, 237, 0.14);
    --accent: #6c9bff;
    --pos: #4cc38a;
    --neg: #e5484d;
    --warn: #e0a23a;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background: var(--deep);
    color: var(--text);
    font: 400 14px/20px var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* menu bar strip: context only, not part of the design */
  .menubar {
    height: 32px; display: flex; justify-content: flex-end; align-items: center;
    gap: 16px; padding: 0 16px; background: #0a0a0b; border-bottom: 1px solid var(--line);
    color: var(--text-3); font-size: 13px;
  }
  .menubar .item { display: flex; align-items: center; gap: 4px; color: var(--text); padding: 2px 8px; border-radius: 4px; background: var(--raised); }
  .menubar .count { font: 500 12px/16px var(--mono); font-variant-numeric: tabular-nums; }
  .menubar .count:empty { display: none; }

  .stage { display: flex; justify-content: flex-end; padding: 8px 16px; }
  .panel {
    width: 440px; background: var(--card); border: 1px solid var(--line-strong);
    border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.45); overflow: hidden;
  }

  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* tabs */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
  .tab {
    height: 32px; display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 8px; background: transparent; color: var(--text-3);
    font: 500 13px/20px var(--sans); cursor: default;
    transition: color 150ms var(--ease), background-color 150ms var(--ease);
  }
  .tab:hover { color: var(--text-2); }
  .tab[aria-selected="true"] { background: var(--raised); color: var(--text); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
  .tab .n { font: 400 12px/16px var(--mono); font-variant-numeric: tabular-nums; color: var(--text-3); }
  .tab[aria-selected="true"] .n { color: var(--text-2); }

  .body { padding: 8px; min-height: 240px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 2px; }
  .pane[hidden] { display: none; }
  .pane { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; min-width: 0; }

  /* approval rows */
  .row { position: relative; padding: 12px; border-radius: 8px; transition: background-color 150ms var(--ease); }
  .row.approval { cursor: default; }
  .row.approval:hover { background: rgba(255,255,255,0.03); }
  .row.approval.sel { background: var(--raised); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
  .line1, .line2 { display: flex; align-items: baseline; gap: 8px; }
  .line1 .dot { align-self: center; }
  .tool { font-weight: 500; }
  .sum { flex: 1; min-width: 0; font: 400 13px/20px var(--mono); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wait { font: 400 12px/16px var(--mono); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .line2 { margin-top: 4px; padding-left: 16px; font-size: 12px; line-height: 16px; color: var(--text-3); }
  .line2 .meta { flex: 1; }
  .risk { color: var(--text-3); }
  .risk.high { color: #ef7a7e; }
  .risk.medium { color: var(--warn); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .dot.high { background: var(--neg); }
  .dot.medium { background: var(--warn); }
  .dot.low { background: var(--text-3); }
  .rep { font: 400 12px/16px var(--mono); color: var(--text-3); margin-left: 4px; }

  /* 90s countdown: the signature */
  .count-line { position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 1px; background: var(--line); overflow: hidden; }
  .count-line i { display: block; height: 100%; width: 100%; background: var(--text-3); opacity: 0.5; transform-origin: left; transition: transform 1s linear; }
  .count-line.urgent i { background: var(--neg); opacity: 1; }

  /* expanded detail */
  .detail { margin-top: 12px; display: grid; gap: 12px; }
  .code { padding: 8px 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); font: 400 12px/20px var(--mono); color: var(--text); white-space: pre-wrap; word-break: break-all; }
  .code .add { color: var(--pos); display: block; }
  .code .del { color: #ef7a7e; display: block; }
  .code .ctx { color: var(--text-3); display: block; }
  .kv { display: grid; grid-template-columns: 72px 1fr; gap: 4px 8px; font-size: 12px; line-height: 16px; color: var(--text-3); }
  .kv b { font-weight: 400; color: var(--text-2); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    height: 32px; padding: 0 10px; display: inline-flex; align-items: center; gap: 8px;
    border-radius: 8px; border: 1px solid var(--line-strong); background: var(--card);
    color: var(--text); font: 500 13px/20px var(--sans); cursor: default;
    transition: background-color 150ms var(--ease), transform 150ms var(--ease);
  }
  .btn:hover { background: #2a2a2d; }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--text); color: #141415; border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,0.5); }
  .btn.primary:hover { background: #fff; }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--text-2); padding: 0 8px; }
  .btn.quiet:hover { background: rgba(255,255,255,0.05); }
  .btn[disabled] { opacity: 0.4; }
  .keys { display: inline-flex; gap: 2px; }
  kbd {
    min-width: 20px; height: 20px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 4px; border: 1px solid var(--line-strong); border-bottom-width: 2px;
    font: 400 11px/16px var(--sans); color: var(--text-2); background: rgba(255,255,255,0.04);
  }
  .btn.primary kbd { border-color: rgba(0,0,0,0.18); color: #3a3a3c; background: rgba(0,0,0,0.05); }
  .hint { font-size: 12px; line-height: 16px; color: var(--text-3); }

  .reason { display: flex; gap: 8px; }
  .reason input {
    flex: 1; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--bg); color: var(--text); font: 400 13px/20px var(--sans); outline: none;
  }

  /* empty */
  .empty { padding: 48px 16px; text-align: center; color: var(--text-3); }
  .empty strong { display: block; font-weight: 500; color: var(--text-2); margin-bottom: 4px; }

  /* sessions */
  .srow { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 8px; }
  .srow:hover { background: rgba(255,255,255,0.03); }
  .srow .name { flex: 1; min-width: 0; }
  .srow .name small { display: block; font-size: 12px; line-height: 16px; color: var(--text-3); font-family: var(--mono); }
  .srow .st { font-size: 12px; color: var(--text-3); }
  .srow .st.waiting { color: var(--warn); }
  .dot.running { background: var(--pos); }
  .dot.waiting { background: var(--warn); }
  .dot.idle { background: var(--text-3); opacity: 0.6; }
  .label { padding: 16px 12px 4px; font-size: 12px; line-height: 16px; color: var(--text-3); }
  .label:first-child { padding-top: 8px; }

  /* environment */
  .erow { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 4px 12px; border-radius: 8px; }
  .erow:hover { background: rgba(255,255,255,0.03); }
  .erow .main { flex: 1; min-width: 0; }
  .erow .main small { display: block; font-size: 12px; line-height: 16px; color: var(--text-3); }
  .mono { font-family: var(--mono); font-size: 13px; }
  .chk { appearance: none; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--bg); flex: none; display: grid; place-items: center; }
  .chk:checked { background: var(--text); border-color: var(--text); }
  .chk:checked::after { content: ""; width: 8px; height: 4px; border-left: 1.5px solid #141415; border-bottom: 1.5px solid #141415; transform: translateY(-1px) rotate(-45deg); }
  .conf { font: 400 12px/16px var(--mono); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .conf.low { color: var(--warn); }
  .plan { margin: 8px 4px 4px; padding: 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); display: grid; gap: 12px; }
  .plan code { display: block; font: 400 12px/20px var(--mono); color: var(--text-2); white-space: pre-wrap; }
  .plan .bar { display: flex; align-items: center; justify-content: space-between; }

  /* rules */
  .frow { padding: 12px; border-radius: 8px; display: grid; gap: 4px; }
  .frow:hover { background: rgba(255,255,255,0.03); }
  .frow .top { display: flex; align-items: baseline; gap: 8px; }
  .frow .top .kind { font-size: 12px; line-height: 16px; color: var(--text-3); width: 80px; flex: none; }
  .frow .top .what { flex: 1; min-width: 0; }
  .frow .locs { padding-left: 88px; display: grid; gap: 0; font: 400 12px/20px var(--mono); color: var(--text-3); }

  .foot { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 8px 0 16px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 12px; }
  .foot .l { display: flex; align-items: center; gap: 8px; }
  .foot .r { display: flex; }

  .demo { position: fixed; left: 16px; bottom: 16px; color: var(--text-3); font-size: 12px; display: grid; gap: 8px; }
  .demo button { all: unset; color: var(--text-2); text-decoration: underline; text-underline-offset: 2px; cursor: default; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/></symbol>
</svg>

<div class="menubar">
  <span>Wed 10:42</span>
  <span class="item"><svg class="i"><use href="#i-term"/></svg><span class="count" id="badge"></span></span>
</div>

<div class="stage">
  <div class="panel" role="dialog" aria-label="Muster">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="approvals"><svg class="i"><use href="#i-inbox"/></svg>Approvals <span class="n" id="n-approvals"></span></button>
      <button class="tab" role="tab" data-tab="sessions"><svg class="i"><use href="#i-term"/></svg>Sessions <span class="n" id="n-sessions"></span></button>
      <button class="tab" role="tab" data-tab="env"><svg class="i"><use href="#i-server"/></svg>Env <span class="n" id="n-env"></span></button>
      <button class="tab" role="tab" data-tab="rules"><svg class="i"><use href="#i-file"/></svg>Rules <span class="n" id="n-rules"></span></button>
    </div>
    <div class="body">
      <div class="pane" id="p-approvals"></div>
      <div class="pane" id="p-sessions" hidden></div>
      <div class="pane" id="p-env" hidden></div>
      <div class="pane" id="p-rules" hidden></div>
    </div>
    <div class="foot">
      <div class="l"><span class="keys"><kbd>⌃</kbd><kbd>⌥</kbd><kbd>A</kbd></span><span>opens the panel</span></div>
      <div class="r"><button class="btn quiet">Settings</button><button class="btn quiet">Quit</button></div>
    </div>
  </div>
</div>

<div class="demo">
  <span>j / k select · ⏎ allow · ⌥⏎ similar · ⌫ deny · ⌘⏎ terminal · click the tabs</span>
  <button id="reset">Reset demo</button>
</div>

<script>
const TIMEOUT = 90;
const seed = () => ({
  approvals: [
    { id: 'a1', tool: 'Bash', sum: 'rm -rf ./build', risk: 'high', cwd: '~/Code/inkwell', agent: 'claude', session: '7c1e…a90', elapsed: 42, rep: 1,
      body: 'rm -rf ./build' },
    { id: 'a2', tool: 'Bash', sum: 'git push origin main', risk: 'high', cwd: '~/Code/api', agent: 'codex', session: '2f40…c1d', elapsed: 12, rep: 1,
      body: 'git push origin main' },
    { id: 'a3', tool: 'Edit', sum: 'src/app.ts  +2 −1', risk: 'medium', cwd: '~/Code/inkwell', agent: 'claude', session: '7c1e…a90', elapsed: 8, rep: 1,
      diff: [['ctx','  export function boot() {'],['del','-   const port = 3000'],['add','+   const port = Number(process.env.PORT ?? 3000)'],['add','+   validate(port)'],['ctx','    return listen(port)']] },
    { id: 'a4', tool: 'Bash', sum: 'pnpm install', risk: 'medium', cwd: '~/Code/inkwell', agent: 'claude', session: '9b03…e77', elapsed: 5, rep: 3,
      body: 'pnpm install' },
  ],
  sessions: [
    { name: 'inkwell', cwd: '~/Code/inkwell', agent: 'claude', state: 'waiting', ago: 'now', note: '3 approvals' },
    { name: 'api', cwd: '~/Code/api', agent: 'codex', state: 'waiting', ago: 'now', note: '1 approval' },
    { name: 'muster', cwd: '~/Code/muster', agent: 'claude', state: 'running', ago: '4s', note: 'Bash: swift build' },
    { name: 'dotfiles', cwd: '~/Code/dotfiles', agent: 'claude', state: 'idle', ago: '12m', note: 'Idle' },
  ],
  ports: [
    { id: 'p1', port: ':5173', proc: 'node · vite', owner: 'inkwell · claude', pid: 51234, conf: 96 },
    { id: 'p2', port: ':8787', proc: 'wrangler dev', owner: 'api · codex', pid: 51802, conf: 91 },
  ],
  orphans: [
    { id: 'o1', proc: 'esbuild', owner: 'inkwell', pid: 48211, detail: 'ppid 1 · 78% CPU for 6 min', conf: 84 },
    { id: 'o2', proc: 'node', owner: 'unknown', pid: 40907, detail: 'cwd matches ~/Code/api', conf: 52 },
  ],
  worktrees: [
    { id: 'w1', path: 'inkwell/.wt/fix-auth', why: 'Directory missing', repo: '~/Code/inkwell' },
    { id: 'w2', path: 'inkwell/.wt/spike-ws', why: 'Branch merged', repo: '~/Code/inkwell' },
  ],
});
let S = seed();
let tab = ['approvals','sessions','env','rules'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'approvals', sel = null, denying = false;
const checked = new Set(['p1', 'p2', 'o1', 'w1']);
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const riskLabel = { high: 'High', medium: 'Medium', low: 'Low' };

const sorted = () => [...S.approvals].sort((a, b) =>
  (['low','medium','high'].indexOf(b.risk) - ['low','medium','high'].indexOf(a.risk)) || (b.elapsed - a.elapsed));

function renderApprovals() {
  const list = sorted();
  if (!list.some(a => a.id === sel)) sel = list[0]?.id ?? null;
  const el = $('#p-approvals');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><strong>Nothing waiting</strong>Requests from your agents appear here</div>`;
    return;
  }
  el.innerHTML = list.map(a => {
    const open = a.id === sel;
    const remain = Math.max(0, TIMEOUT - a.elapsed);
    const detail = !open ? '' : `
      <div class="detail">
        <div class="code">${a.diff ? a.diff.map(([k, t]) => `<span class="${k}">${esc(t)}</span>`).join('') : esc(a.body)}</div>
        <div class="kv"><span>Folder</span><b>${a.cwd}</b><span>Session</span><b>${a.agent} · ${a.session}</b><span>Expires</span><b id="exp-${a.id}">in ${remain}s, then the agent asks you itself</b></div>
        ${denying ? `
          <div class="reason"><input id="reason" value="Denied from Muster" aria-label="Reason sent to the agent"><button class="btn primary" data-act="confirm-deny">Deny <span class="keys"><kbd>⏎</kbd></span></button></div>
          <div class="hint">The agent receives this reason · Esc to cancel</div>` : `
          <div class="actions">
            <button class="btn primary" data-act="allow">Allow <span class="keys"><kbd>⏎</kbd></span></button>
            <button class="btn" data-act="deny">Deny <span class="keys"><kbd>⌫</kbd></span></button>
            <button class="btn" data-act="similar" ${a.risk === 'high' ? 'disabled title="Not offered for high-risk commands"' : ''}>Similar <span class="keys"><kbd>⌥</kbd><kbd>⏎</kbd></span></button>
            <button class="btn quiet" data-act="term">Terminal</button>
          </div>`}
      </div>`;
    return `<div class="row approval ${open ? 'sel' : ''}" data-id="${a.id}">
      <div class="line1"><span class="dot ${a.risk}"></span><span class="tool">${a.tool}</span><span class="sum">${esc(a.sum)}</span>${a.rep > 1 ? `<span class="rep">×${a.rep}</span>` : ''}<span class="wait" id="w-${a.id}">${a.elapsed}s</span></div>
      <div class="line2"><span class="meta">${a.cwd} · ${a.agent}</span><span class="risk ${a.risk}">${riskLabel[a.risk]}</span></div>
      ${detail}
      <div class="count-line ${remain <= 15 ? 'urgent' : ''}" id="c-${a.id}"><i style="transform:scaleX(${remain / TIMEOUT})"></i></div>
    </div>`;
  }).join('');
  if (denying) { const r = $('#reason'); r.focus(); r.select(); }
}

function renderSessions() {
  const dot = s => `<span class="dot ${s.state}"></span>`;
  $('#p-sessions').innerHTML = `
    <div class="label">Active</div>` + S.sessions.map(s => `
    <div class="srow">${dot(s)}<div class="name">${s.name}<small>${s.cwd} · ${s.agent}</small></div>
      <span class="st ${s.state}">${s.state === 'waiting' ? s.note : s.state === 'running' ? s.note : s.note}</span></div>`).join('');
}

function renderEnv() {
  const row = (id, main, sub, right, low) => `<label class="erow"><input class="chk" type="checkbox" data-chk="${id}" ${checked.has(id) ? 'checked' : ''}>
    <div class="main">${main}<small>${sub}</small></div><span class="conf ${low ? 'low' : ''}">${right}</span></label>`;
  const cmds = [];
  S.ports.forEach(p => checked.has(p.id) && cmds.push(`kill -TERM ${p.pid}   # ${p.proc} ${p.port}`));
  S.orphans.forEach(o => checked.has(o.id) && cmds.push(`kill -TERM ${o.pid}   # ${o.proc}`));
  S.worktrees.forEach(w => checked.has(w.id) && cmds.push(`git -C ${w.repo} worktree prune`));
  const uniq = [...new Set(cmds)];
  $('#p-env').innerHTML = `
    <div class="label">Listening ports</div>` +
    S.ports.map(p => row(p.id, `<span class="mono">${p.port}</span> &nbsp;${p.proc}`, p.owner, p.conf + '%')).join('') +
    `<div class="label">Orphaned processes</div>` +
    S.orphans.map(o => row(o.id, `<span class="mono">${o.proc}</span> &nbsp;pid ${o.pid}`, `${o.detail} · ${o.owner}`, o.conf < 80 ? 'Uncertain' : o.conf + '%', o.conf < 80)).join('') +
    `<div class="label">Stale worktrees</div>` +
    S.worktrees.map(w => row(w.id, `<span class="mono">${w.path}</span>`, w.why, 'prune')).join('') +
    `<div class="plan"><code>${uniq.length ? uniq.map(esc).join('\n') : 'Nothing selected'}</code>
      <div class="bar"><span class="hint">Shown commands are exactly what runs</span><button class="btn primary" ${uniq.length ? '' : 'disabled'}>Clean up ${uniq.length || ''}</button></div></div>`;
  $('#n-env').textContent = S.ports.length + S.orphans.length + S.worktrees.length;
}

function renderRules() {
  const f = (kind, what, locs) => `<div class="frow"><div class="top"><span class="kind">${kind}</span><span class="what">${what}</span><button class="btn quiet">Copy fix</button></div><div class="locs">${locs.map(l => `<span>${l}</span>`).join('')}</div></div>`;
  $('#p-rules').innerHTML =
    f('Duplicate', 'Run tests before committing', ['inkwell/CLAUDE.md:14', 'api/AGENTS.md:9']) +
    f('Broken ref', '<span class="mono">scripts/deploy.sh</span> does not exist', ['api/CLAUDE.md:31']) +
    f('Broken ref', '<span class="mono">pnpm lint:fix</span> not found on PATH', ['inkwell/CLAUDE.md:22']) +
    f('Conflict', 'Use pnpm &nbsp;vs&nbsp; use npm', ['inkwell/CLAUDE.md:6', 'dotfiles/AGENTS.md:3']) +
    f('Duplicate', 'Prefer named exports', ['api/CLAUDE.md:40', 'inkwell/CLAUDE.md:18']);
  $('#n-rules').textContent = 5;
}

function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
  ['approvals', 'sessions', 'env', 'rules'].forEach(k => $('#p-' + k).hidden = k !== tab);
  const n = S.approvals.length;
  $('#n-approvals').textContent = n || '';
  $('#badge').textContent = n || '';
  $('#n-sessions').textContent = S.sessions.length;
}

function renderAll() { renderApprovals(); renderSessions(); renderEnv(); renderRules(); renderTabs(); }

function resolve(kind) {
  const a = S.approvals.find(x => x.id === sel); if (!a) return;
  if (kind === 'similar' && a.risk === 'high') return;
  const i = sorted().findIndex(x => x.id === a.id);
  S.approvals = S.approvals.filter(x => x.id !== a.id);
  const next = sorted(); sel = next[Math.min(i, next.length - 1)]?.id ?? null;
  denying = false; renderApprovals(); renderTabs();
}
function move(d) {
  const l = sorted(); if (!l.length) return;
  const i = Math.min(Math.max(l.findIndex(x => x.id === sel) + d, 0), l.length - 1);
  sel = l[i].id; denying = false; renderApprovals();
}

document.addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (t) { tab = t.dataset.tab; renderTabs(); return; }
  const row = e.target.closest('.row.approval');
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'allow' || act === 'similar') return resolve(act);
  if (act === 'deny') { denying = true; return renderApprovals(); }
  if (act === 'confirm-deny') return resolve('deny');
  if (row && row.dataset.id !== sel) { sel = row.dataset.id; denying = false; renderApprovals(); }
});
document.addEventListener('change', e => {
  const id = e.target.dataset.chk; if (!id) return;
  e.target.checked ? checked.add(id) : checked.delete(id); renderEnv();
});
document.addEventListener('keydown', e => {
  if (denying) {
    if (e.key === 'Enter') { e.preventDefault(); resolve('deny'); }
    if (e.key === 'Escape') { denying = false; renderApprovals(); }
    return;
  }
  if (tab !== 'approvals') return;
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === 'Enter' && e.altKey) { e.preventDefault(); resolve('similar'); }
  else if (e.key === 'Enter' && !e.metaKey) { e.preventDefault(); resolve('allow'); }
  else if (e.key === 'Backspace') { e.preventDefault(); if (sel) { denying = true; renderApprovals(); } }
});
$('#reset').onclick = () => { S = seed(); sel = null; denying = false; renderAll(); };

// once per second: advance clocks, update only the changed nodes (never re-render the reason field)
setInterval(() => {
  let expired = false;
  S.approvals.forEach(a => a.elapsed++);
  S.approvals.filter(a => a.elapsed >= TIMEOUT).forEach(() => expired = true);
  if (expired) {
    S.approvals = S.approvals.filter(a => a.elapsed < TIMEOUT);
    denying = false; renderApprovals(); renderTabs(); return;
  }
  S.approvals.forEach(a => {
    const remain = TIMEOUT - a.elapsed;
    const w = $('#w-' + a.id); if (w) w.textContent = a.elapsed + 's';
    const c = $('#c-' + a.id); if (c) { c.classList.toggle('urgent', remain <= 15); c.firstElementChild.style.transform = `scaleX(${remain / TIMEOUT})`; }
    const x = $('#exp-' + a.id); if (x) x.textContent = `in ${remain}s, then the agent asks you itself`;
  });
}, 1000);

renderAll();
</script>
</body>
</html>
